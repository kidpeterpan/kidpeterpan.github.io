{{ define "main" }}
  <main class="wrap page-body">
    <section class="win not-found out" aria-labelledby="win-404-title">
      {{ partial "window-bar.html" (dict "id" "win-404-title" "title" (i18n "error_title") "tag" "p") }}
      <div class="win-body">
        <div class="well in">
          <h1>{{ i18n "notfound_title" }}</h1>
          <p>{{ i18n "notfound_body" }}</p>
          <div class="actions">
            <a class="btn" href="{{ "/" | relLangURL }}">{{ i18n "notfound_home" }}</a>
            <a class="btn-ghost" href="{{ "/open-mtp-client/" | relLangURL }}">open-mtp-client</a>
            <a class="btn-ghost" href="{{ "/inkbound/" | relLangURL }}">Inkbound</a>
          </div>
        </div>
      </div>
    </section>
  </main>
{{ end }}
