<div class="share-block">
  <p class="share-label">SHARE THIS POST</p>
  <div class="share-row" data-share-title="{{ .Title }}" data-share-url="{{ .Permalink }}">
    <button type="button" class="share-btn share-native" aria-label="Share this post">Share</button>
    <div class="share-fallback-row">
      <a
        class="share-btn"
        href="https://twitter.com/intent/tweet?text={{ .Title | urlquery }}&url={{ .Permalink | urlquery }}"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Share on X"
      >X</a>
      <a
        class="share-btn"
        href="https://www.facebook.com/sharer/sharer.php?u={{ .Permalink | urlquery }}"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Share on Facebook"
      >FB</a>
      <a
        class="share-btn"
        href="https://www.linkedin.com/sharing/share-offsite/?url={{ .Permalink | urlquery }}"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Share on LinkedIn"
      >in</a>
      <button type="button" class="share-btn share-copy" aria-label="Copy link to this post">Copy link</button>
    </div>
    <span class="share-status" role="status" aria-live="polite"></span>
  </div>
</div>
