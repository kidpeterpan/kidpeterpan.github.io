{{ define "main" }}
  <main class="wrap page-body">
    <article class="reveal">
      <a href="{{ "/" | relURL }}" class="back-link"><span class="arr">←</span> Home</a>
      <header class="article-head">
        <h1>{{ .Title }}</h1>
        {{ with .Description }}
          <p class="desc">{{ . }}</p>
        {{ end }}
        <div class="article-rule"></div>
      </header>
      <div class="prose">
        {{ .Content }}
      </div>
    </article>
  </main>
{{ end }}
