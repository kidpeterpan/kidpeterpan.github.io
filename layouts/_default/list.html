{{ define "main" }}
  <main class="wrap list-body">
    <header class="list-head reveal">
      <a href="{{ "/" | relURL }}" class="back-link"><span class="arr">←</span> Home</a>
      <h1>{{ .Title }}</h1>
      {{ with .Description }}
        <p class="desc">{{ . }}</p>
      {{ end }}
    </header>
    <ul class="page-list reveal d1">
      {{ range .RegularPages }}
        <li>
          <a href="{{ .RelPermalink }}">{{ .Title }}</a>
          {{ with .Description }}<p>{{ . }}</p>{{ end }}
        </li>
      {{ end }}
    </ul>
  </main>
{{ end }}
