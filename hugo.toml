baseURL = 'https://kidpeterpan.github.io/'
defaultContentLanguage = 'th'
locale = 'th-TH'
title = 'kidpeterpan.github.io'
enableRobotsTXT = true

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.goldmark.extensions.typographer]
    enable = true
  [markup.highlight]
    style = 'monokai'
    noClasses = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3

[params]
author = 'kidpeterpan'
description = 'บันทึกการเรียนรู้ภาษา Go, software engineering, AI และหนังสือ โดย kidpeterpan'
googleAnalytics = 'G-LT3TCEMESB'

[build.buildStats]
enable = true

[[build.cachebusters]]
source = 'assets/notwatching/hugo_stats\\.json'
target = 'css'

[[build.cachebusters]]
source = '(postcss|tailwind)\\.config\\.js'
target = 'css'

[[module.mounts]]
source = 'assets'
target = 'assets'

[[module.mounts]]
disableWatch = true
source = 'hugo_stats.json'
target = 'assets/notwatching/hugo_stats.json'

# Hugo 0.161+ invokes Node with --permission (Node permission model).
# Requires Node ≥22 unless you disable it here (Node 20 is common on macOS/Homebrew).
[security.node.permissions]
disable = true
