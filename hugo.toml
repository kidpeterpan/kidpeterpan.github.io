baseURL = 'https://kidpeterpan.github.io/'
defaultContentLanguage = 'en'
title = 'kidpeterpan'
enableRobotsTXT = true
enableGitInfo = true
disableKinds = ['taxonomy', 'term', 'rss']

[languages]

[languages.en]
locale = 'en-US'
label = 'English'
weight = 1

[languages.en.params]
siteTitleFull = 'kidpeterpan — small, free apps that fix annoying problems'
description = 'Free apps: Android-to-Mac transfer, Obsidian EPUB export, and PlayStation Remote Play with multiple OCR engines and Thai/English output.'

[languages.th]
locale = 'th-TH'
label = 'ไทย'
weight = 2

[languages.th.params]
siteTitleFull = 'kidpeterpan — แอปเล็ก ๆ ฟรี ที่แก้ปัญหากวนใจ'
description = 'แอปฟรี: ย้ายไฟล์ Android ไป Mac, ส่งออกโน้ต Obsidian เป็น EPUB และ PlayStation Remote Play ที่มี OCR หลายเอนจิน พร้อมแปลเป็นไทยหรืออังกฤษ'

[languages.zh-cn]
locale = 'zh-CN'
label = '简体中文'
weight = 3
hasCJKLanguage = true

[languages.zh-cn.params]
siteTitleFull = 'kidpeterpan — 解决烦心小事的免费小应用'
description = '免费应用：Android 到 Mac 的文件传输、Obsidian 导出 EPUB，以及支持多种 OCR 引擎、可输出泰语/英语翻译的 PlayStation Remote Play。'

[languages.ja]
locale = 'ja-JP'
label = '日本語'
weight = 4
hasCJKLanguage = true

[languages.ja.params]
siteTitleFull = 'kidpeterpan — 小さな悩みを解決する、無料の小さなアプリ'
description = '無料アプリ：Android から Mac へのファイル転送、Obsidian の EPUB 書き出し、複数の OCR エンジンとタイ語/英語の翻訳表示に対応した PlayStation Remote Play。'

[markup]
  [markup.goldmark.parser]
    wrapStandAloneImageWithinParagraph = false
  [markup.goldmark.renderer]
    unsafe = true
  [markup.goldmark.extensions.typographer]
    enable = true
  [markup.highlight]
    style = 'monokai'
    noClasses = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3

[params]
author = 'kidpeterpan'
github = 'https://github.com/kidpeterpan'
coffee = 'https://buymeacoffee.com/kidpeterpan'
googleAnalytics = 'G-LT3TCEMESB'

[build.buildStats]
enable = true

[[build.cachebusters]]
source = 'assets/notwatching/hugo_stats\\.json'
target = 'css'

[[build.cachebusters]]
source = '(postcss|tailwind)\\.config\\.js'
target = 'css'

[[module.mounts]]
source = 'assets'
target = 'assets'

[[module.mounts]]
disableWatch = true
source = 'hugo_stats.json'
target = 'assets/notwatching/hugo_stats.json'

# Hugo 0.161+ invokes Node with --permission (Node permission model).
# Requires Node ≥22 unless you disable it here (Node 20 is common on macOS/Homebrew).
[security.node.permissions]
disable = true

# Hugo 0.165+ processes Tailwind CSS v4 with the standalone `tailwindcss`
# binary instead of going through `node`; whitelist it so the build can run it.
[security.exec]
allow = ['^(dart-)?sass$', '^go$', '^git$', '^node$', '^postcss$', '^tailwindcss$']
