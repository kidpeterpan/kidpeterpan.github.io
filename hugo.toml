baseURL = 'https://kidpeterpan.github.io/'
defaultContentLanguage = 'en'
locale = 'en-US'
title = 'kidpeterpan'
enableRobotsTXT = true
enableGitInfo = true
disableKinds = ['taxonomy', 'term', 'rss']

[markup]
  [markup.goldmark.parser]
    wrapStandAloneImageWithinParagraph = false
  [markup.goldmark.renderer]
    unsafe = true
  [markup.goldmark.extensions.typographer]
    enable = true
  [markup.highlight]
    style = 'monokai'
    noClasses = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3

[params]
author = 'kidpeterpan'
siteTitleFull = 'kidpeterpan — small, free apps that fix annoying problems'
description = 'Free, open source apps by kidpeterpan. open-mtp-client copies files between your Mac and your Android phone. Inkbound turns Obsidian notes into EPUB books for e-readers.'
github = 'https://github.com/kidpeterpan'
coffee = 'https://buymeacoffee.com/kidpeterpan'
googleAnalytics = 'G-LT3TCEMESB'

[build.buildStats]
enable = true

[[build.cachebusters]]
source = 'assets/notwatching/hugo_stats\\.json'
target = 'css'

[[build.cachebusters]]
source = '(postcss|tailwind)\\.config\\.js'
target = 'css'

[[module.mounts]]
source = 'assets'
target = 'assets'

[[module.mounts]]
disableWatch = true
source = 'hugo_stats.json'
target = 'assets/notwatching/hugo_stats.json'

# Hugo 0.161+ invokes Node with --permission (Node permission model).
# Requires Node ≥22 unless you disable it here (Node 20 is common on macOS/Homebrew).
[security.node.permissions]
disable = true

# Hugo 0.165+ processes Tailwind CSS v4 with the standalone `tailwindcss`
# binary instead of going through `node`; whitelist it so the build can run it.
[security.exec]
allow = ['^(dart-)?sass$', '^go$', '^git$', '^node$', '^postcss$', '^tailwindcss$']
